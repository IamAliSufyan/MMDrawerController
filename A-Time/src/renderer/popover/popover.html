<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>PaceBar</title>
  <link rel="stylesheet" href="popover.css" />
</head>
<body>
  <div class="panel">
    <div class="pop-header">
      <span class="pop-title">PaceBar</span>
      <button id="settingsBtn" class="icon-btn" title="Settings">⚙︎</button>
    </div>
    <button id="newBtn" class="new-btn"><span class="plus">+</span> New Timer</button>
    <div id="list" class="list"></div>
    <div class="footer">
      <button id="quitBtn" class="footer-btn" title="Quit PaceBar">Quit</button>
    </div>
  </div>
  <script type="module" src="popover.js"></script>
</body>
</html>
